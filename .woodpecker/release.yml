when:
  event: tag

skip_clone: true

steps:
  clone:
    image: bash
    commands:
      - git fetch origin tag ${CI_COMMIT_TAG} --no-tags
      - git checkout ${CI_COMMIT_TAG}
    labels:
      role: cpp-builder

  build:
    image: bash
    commands:
      - set -o pipefail && ./build.sh 2>&1 | tee /tmp/woodpecker-build.log
    depends_on:
      - clone
    labels:
      role: cpp-builder
